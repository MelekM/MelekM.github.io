<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">Image-to-Canvas Workflow</title>
<desc id="desc">Conceptual processing flow for turning an uploaded image into reviewable outputs.</desc>
<defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <path d="M0,0 L10,4 L0,8 z" fill="#0f766e"/>
      </marker>
    </defs>
<rect width="1120" height="330" rx="28" fill="#f8f6f0"/>
<text x="48" y="58" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1f2937">Image-to-Canvas Workflow</text>
<text x="48" y="92" font-family="Arial, sans-serif" font-size="17" fill="#5f6f73">Conceptual processing flow for turning an uploaded image into reviewable outputs.</text>
<rect x="48" y="140" width="190" height="112" rx="18" fill="#ffffff" stroke="#d8ded8" filter="url(#shadow)"/>
<circle cx="76" cy="170" r="15" fill="#e6f4f1" stroke="#b6d8d1"/>
<text x="76" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">1</text>
<text x="100" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Upload</text>
<text x="66" y="202" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">Receive source image</text>
<text x="66" y="221" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">and rendering settings</text>
<line x1="245" y1="196.0" x2="255" y2="196.0" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="262" y="140" width="190" height="112" rx="18" fill="#ffffff" stroke="#d8ded8" filter="url(#shadow)"/>
<circle cx="290" cy="170" r="15" fill="#e6f4f1" stroke="#b6d8d1"/>
<text x="290" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">2</text>
<text x="314" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Normalize</text>
<text x="280" y="202" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">Resize and prepare</text>
<text x="280" y="221" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">image for</text>
<text x="280" y="240" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">deterministic</text>
<line x1="459" y1="196.0" x2="469" y2="196.0" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="476" y="140" width="190" height="112" rx="18" fill="#ffffff" stroke="#d8ded8" filter="url(#shadow)"/>
<circle cx="504" cy="170" r="15" fill="#e6f4f1" stroke="#b6d8d1"/>
<text x="504" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">3</text>
<text x="528" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Quantize</text>
<text x="494" y="202" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">Map image colors to a</text>
<text x="494" y="221" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">constrained palette</text>
<line x1="673" y1="196.0" x2="683" y2="196.0" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="690" y="140" width="190" height="112" rx="18" fill="#ffffff" stroke="#d8ded8" filter="url(#shadow)"/>
<circle cx="718" cy="170" r="15" fill="#e6f4f1" stroke="#b6d8d1"/>
<text x="718" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">4</text>
<text x="742" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Render</text>
<text x="708" y="202" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">Create preview image</text>
<text x="708" y="221" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">and print-oriented</text>
<text x="708" y="240" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">guides</text>
<line x1="887" y1="196.0" x2="897" y2="196.0" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="904" y="140" width="190" height="112" rx="18" fill="#ffffff" stroke="#d8ded8" filter="url(#shadow)"/>
<circle cx="932" cy="170" r="15" fill="#e6f4f1" stroke="#b6d8d1"/>
<text x="932" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">5</text>
<text x="956" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937">Review</text>
<text x="922" y="202" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">Store artifacts for</text>
<text x="922" y="221" font-family="Arial, sans-serif" font-size="14" fill="#5f6f73">dashboard inspection</text>
</svg>